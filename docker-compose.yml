version: '3.8'

services:
  crm-app:
    build: .
    container_name: mekong_mobile_crm
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./src/config/tickets_data.json:/app/src/config/tickets_data.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s